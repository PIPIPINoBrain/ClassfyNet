train: ./data/train.txt
val:   ./data/val.txt
test:  ./data/test.txt

#VGG11 VGG13 VGG16 VGG19 
#ResNet18 ResNet34 ResNet50 ResNet101 ResNet152
model: ResNet18

color: 0                      #0 gray   1 RGB

# ============ 多任务定义 ============
# 顺序 = txt 每行标签的顺序
tasks:
  classes:
    cat: 0
    dog: 1
    person: 2
  types:
    photo: 0
    painting: 1
    
# 可选：每任务损失权重，默认全 1.0
task_weights:
  classes: 1.0
  types: 1.0